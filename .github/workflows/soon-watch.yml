name: Weekly Coming Soon watch

on:
  schedule:
    - cron: '11 10 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/new-session-9aa459
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/soon-watch.cjs 
      - name: Commit the report if it changed
        run: |
          git config user.name  "well-seasoned-bot"
          git config user.email "bot@itswellseasoned.com"
          if git diff --quiet -- soon-watch.md; then
            echo "Findings unchanged — nothing to commit."
            exit 0
          fi
          git add soon-watch.md
          git commit -m "chore: Weekly Coming Soon watch"
          git push origin claude/new-session-9aa459
