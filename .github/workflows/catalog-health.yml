name: Weekly catalog health

on:
  schedule:
    - cron: '31 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/new-session-9aa459
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run health check
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: node scripts/catalog-health.cjs
      - name: Commit the report if it changed
        run: |
          git config user.name  "well-seasoned-bot"
          git config user.email "bot@itswellseasoned.com"
          if git diff --quiet -- catalog-health.md; then
            echo "No change in findings — nothing to commit."
            exit 0
          fi
          git add catalog-health.md
          git commit -m "chore: weekly catalog health report"
          git push origin claude/new-session-9aa459
