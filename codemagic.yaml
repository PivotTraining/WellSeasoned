## Codemagic CI config — builds the iOS app in app/ on a cloud Mac and
## (once code signing is connected in the Codemagic UI) uploads straight to
## TestFlight. No local Xcode/disk space needed — see app/README.md for the
## one-time setup steps (create an App Store Connect API key, connect it in
## Codemagic → Team settings → Integrations, then trigger a build).
##
## The web app itself (index.html) needs no build step — the native wrapper
## loads the LIVE site at runtime (capacitor.config.json → server.url), so
## this workflow only builds the native shell.

workflows:
  ios-workflow:
    name: Well Seasoned — iOS
    max_build_duration: 90   # first run creates cert/profile + cold CocoaPods cache — give it headroom
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: well_seasoned_asc   # rename to match the key name you create in Codemagic's UI
    environment:
      vars:
        BUNDLE_ID: "com.wellseasoned.app"
        XCODE_WORKSPACE: "app/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          cd app
          npm install
      - name: Install CocoaPods dependencies
        script: |
          cd app/ios/App
          pod install
      # Auto-increments the build number every run using Codemagic's own build
      # counter (no Apple lookup needed) — avoids "this build number has
      # already been used" if a build is ever re-run for the same version.
      - name: Set the build number
        script: |
          cd app/ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Set up keychain
        script: keychain initialize
      # This is the step that actually CREATES the App Store distribution
      # certificate + provisioning profile the first time — the shortcut
      # `environment.ios_signing` block only looks for an EXISTING one, which
      # is why a brand-new Apple Developer account hits "no matching profiles
      # found." --create tells it to generate what's missing.
      - name: Fetch signing files (create if missing)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
